spring:
  application:
    name: oosc-agent-reliability
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        period: 0
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
